name: VAVOO Py2 CI
on:
  push:
    branches: [kodi18-py2]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    container: python:2.7
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python 2
        run: python -m compileall plugin.video.vavooto
      - name: Smoke import (Kodi18 mocks)
        run: python tests/smoke_import.py
      - name: HTTP transport tests
        run: python tests/test_http_transport.py
      - name: Kodi18 compat tests
        run: python tests/test_kodi18_compat.py
      - name: linear_lite function tests
        run: python tests/test_linear_lite.py
      - name: live_proxy helper tests
        run: python tests/test_live_proxy_helpers.py
      - name: playback property tests
        run: python tests/test_playback_properties.py
      - name: Package
        run: python -c "import os,zipfile; z=zipfile.ZipFile('/tmp/vavoo.zip','w',zipfile.ZIP_DEFLATED); [z.write(os.path.join(r,f), os.path.relpath(os.path.join(r,f),'plugin.video.vavooto')) for r,_,fs in os.walk('plugin.video.vavooto') for f in fs]; z.close()"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vavoo-py2
          path: /tmp/vavoo.zip
